# 注意: HMBIRD_CPUCTRL_HIGH/LOW 已移出调度档位 —— v3.1 起这两个节点
#   由帧率闭环层(lib/loop.sh)按追帧压力驱动, 调度层不再写,
#   避免同一节点两个写入者互相覆盖。
# 调度策略: 游戏/低延迟
# v4.2 实机验证节点 + 官方内核源码语义(Oplus hmbird.c):
#   parctrl/cpuctrl ratio: util>high 判定并行救援 -> 值越低越早触发并行(性能向)
#   misfit_ds: util>=阈值判 misfit 上大核 -> 值越低越易上大核
#   cpu7_tl: cpu7 任务阈值 -> 值越低越易上超大核
# v5.0 新增(实机验证可写): isoctrl/parctrl_l 同族方向, iso_free_rescue 释放救援, scx_gov_ctrl 保持
PELT_MULTIPLIER=4
CHILD_RUNS_FIRST=1
# RT 节流保留 5% 给 CFS(官方 Android 默认 950000); 1000000 等于取消上限,
# RT 线程(音频/显示)跑飞时会饿死普通任务, 换不到可测的帧率收益
RT_RUNTIME_US=950000
HMBIRD_UCLAMP=1
TOUCH_UP=1
TOUCH_DOWN=1
TOUCH_DURATION=80
CFS_SCHEDSTATS=0
CFS_ENERGY_AWARE=1
HMBIRD_ISOLATE=1
HMBIRD_MISFIT=80
HMBIRD_SLIM=0
HMBIRD_PARC_HIGH=45
HMBIRD_PARC_LOW=35
HMBIRD_PREEMPT=1
HMBIRD_CLUSTER_SEP=0
HMBIRD_C7TL=50
ISOCTRL_HIGH=65
ISOCTRL_LOW=50
ISO_FREE_RESCUE=1
PARC_HIGH_L=55
PARC_LOW_L=40
PARTIAL_CTRL=1
SLIM_WALT_CTRL=0
SCX_GOV_CTRL=1
