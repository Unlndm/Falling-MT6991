# 性能档
# MAXFREQ = 该档的目标频率上限(policy0 policy4 policy7)。
#   不是写死值: 上限层(lib/loop.sh)按追帧压力决定要不要抬到目标,
#   压力不高时让位给系统 —— 实机证明 scaling_max_freq 被 ColorOS 高频抢占。
# EXEC_LEVEL = 该档允许的闭环执行器最高档位(0 最保守 ~ 4 最激进)。
[CPU]
GOVERNOR=performance performance performance
MAXFREQ=2400000 3300000 3730000
EXEC_LEVEL=4
[GPU]
DEVFREQ_GOVERNOR=performance
GPU_UPBOUND=1508000
GPU_BOOST=988000
GPU_BOOST_ENABLE=1
[CM]
CM_PERF_MODE_ENABLE=1
CM_PERF_CEILING_OPP=0
CM_DRAM_OPP_CEILING=-1
[C2PS]
C2PS_UM_MODE=N
