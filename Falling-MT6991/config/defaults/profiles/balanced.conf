# 均衡档(日常, 默认, 省电优先)
# 日常档取值: CPU 三簇上限 ≈ 各簇最高频的 75%
#   policy0 1800000 / policy4 2400000 / policy7 2800000
#   三个值都来自实机频率表(probe 实测: 2400000 / 3300000 / 3730000 是各簇最高频)。
#   更重的负载交给智能调度升 performance(2400000 / 3300000 / 3730000),
#   日常档不再按接近满频跑 —— 这是「日常偏省电」的核心改动。
# MAXFREQ 按 policy0 policy4 policy7 顺序 = 该档的"目标频率上限"。
#   注意不是写死值: 上限层(lib/loop.sh)按追帧压力决定要不要真的抬到目标,
#   压力不高时让位给系统自己给的值 —— 实机证明 scaling_max_freq 会被
#   ColorOS 高频抢占, 硬写只会互相打架。
# EXEC_LEVEL = 该档允许的闭环执行器最高档位(0 最保守 ~ 4 最激进)。
#   日常档封顶 L2: 升频不过度抢跑; 真的追帧由智能调度换 performance(允许 L4)。
[CPU]
GOVERNOR=sugov_ext sugov_ext sugov_ext
MAXFREQ=1800000 2400000 2800000
EXEC_LEVEL=2
[GPU]
DEVFREQ_GOVERNOR=dummy
GPU_UPBOUND=988000
GPU_BOOST=338000
GPU_BOOST_ENABLE=0
[CM]
CM_PERF_MODE_ENABLE=0
CM_PERF_CEILING_OPP=0
CM_DRAM_OPP_CEILING=-1
[C2PS]
C2PS_UM_MODE=Y
