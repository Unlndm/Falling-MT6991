# 注意: HMBIRD_CPUCTRL_HIGH/LOW 已移出调度档位 —— v3.1 起这两个节点
#   由帧率闭环层(lib/loop.sh)按追帧压力驱动, 调度层不再写,
#   避免同一节点两个写入者互相覆盖。
# 调度策略: 省电
# v4.2 实机验证节点 + 官方内核源码语义(Oplus hmbird.c):
#   parctrl/cpuctrl ratio: util>high 判定并行救援 -> 值越高越晚触发并行(省电向)
#   misfit_ds 提高 -> 少判 misfit 少上大核; cpu7_tl 提高 -> 少上超大核
#   开 slim 轻载识别省电; 关 top-app boost
# v5.0 新增(实机验证可写): isoctrl/parctrl_l 提高晚并行, 关 partial 与 iso 救援, 开 slim_walt
# scx_gov_ctrl 由 0 改为 1(省电档也保持 slim-scx 轻载参与; 该键是 slim-scx 参与开关, 不是风驰总开关)
PELT_MULTIPLIER=1
CHILD_RUNS_FIRST=0
RT_RUNTIME_US=950000
HMBIRD_UCLAMP=0
TOUCH_UP=0
TOUCH_DOWN=0
TOUCH_DURATION=70
CFS_SCHEDSTATS=0
CFS_ENERGY_AWARE=1
TOUCH_BOOST_TA=0
TOUCH_BOOST_FG=0
HMBIRD_ISOLATE=0
HMBIRD_MISFIT=100
HMBIRD_SLIM=1
HMBIRD_PARC_HIGH=75
HMBIRD_PARC_LOW=55
HMBIRD_PREEMPT=0
HMBIRD_CLUSTER_SEP=1
HMBIRD_C7TL=90
ISOCTRL_HIGH=85
ISOCTRL_LOW=70
ISO_FREE_RESCUE=0
PARC_HIGH_L=75
PARC_LOW_L=60
PARTIAL_CTRL=0
SLIM_WALT_CTRL=1
SLIM_WALT_POLICY=2
SLIM_FPS=125
SCX_GOV_CTRL=1
