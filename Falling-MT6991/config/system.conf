# ============================================================
# Falling-MT6991 全局配置 (v3.0)
# 调度参数不暴露给用户: 档位/调度策略/IO/温控由守护进程自动决定
# (lib/smart.sh 按温度/CPU 占用率/帧率/前台应用/屏态评分)
# 这里只剩 9 个开关: 守护 / 触控 / 游戏归属 / 调度倾向 / 极致省电 / 通知 / 日志 / ZRAM / 主题
# ============================================================

# 后台守护(智能档位/触控采样率/息屏省电)
daemon=1
# 触控采样率调度(读 触控.md: 日常/游戏命令 + 游戏包名名单)
touch=1
# 游戏调度(只在"是游戏"时生效; 是不是游戏由 触控.md 的游戏包名决定)
#   official = 交官方 HyperBoost/风驰, 模块整体让路, 完全不碰 CPU(默认, 最稳)
#   module   = 模块接管: game_medium 保底, 帧率不足或满载才升性能, 高温照旧降档
game_mode=official
# 调度倾向(只给决策加偏置, 不锁档位; 换档逻辑照旧自动)
#   save   = 省电(默认): 日常更容易落省电档, 更难升到性能档
#   balance= 均衡: 不偏不倚
#   perf   = 性能: 更容易升到性能档, 更难掉到省电档
# 硬规则不受倾向影响: 息屏降档 / 高温强制降档 / 应用策略 / 游戏保底
tendency=save
# 极致省电限制层 (v3.4.0)
#   叠加在当前档位之上的限制层, 不是新档位:
#     CPU 频率上限压到实机频率表的低频点 / GPU 上限压到最低可用频点
#     关 GPU boost / 关 cm_mgr 性能模式 / 开 c2ps
#     sugov_ext 升频间隔拉到很大(升得极慢)、降频间隔拉到最小(掉得极快)
#     hmbird boost 阈值拉高(很少触发 boost)
#   调度策略一律用最省电的那套; 代价是响应会明显变慢, 这是极致省电的应有代价。
#   游戏期间自动失效(产品硬规则: 游戏 CPU 一律不管, 游戏不做极限省电)。
#   参数标定入口: config/profiles/extreme_overlay.conf
extreme=0
# 系统通知
notify=1
# 详细日志
debug=0
# ZRAM 内存优化(odm/etc/oplus_mm_config.xml + 系统 XML bind 覆盖, 安装时改写)
zram=0
# WebUI 外观: 主题模式(light=浅色 / dark=深色, QQ 风格)
theme=light
