# 注意: HMBIRD_CPUCTRL_HIGH/LOW 已移出调度档位 —— v3.1 起这两个节点
#   由帧率闭环层(lib/loop.sh)按追帧压力驱动, 调度层不再写,
#   避免同一节点两个写入者互相覆盖。
# 调度策略: 日常高负载自适应 (v1.2.0)
# 日常场景基础档(balance)之上, 高负载时启用: 更早并行救援 / 更易上大核
# 值全部落在 [官方默认, 游戏档] 区间, 不超 sched_game 激进度
# 官方默认参照: PARC 55/40, ISOCTRL 75/60, MISFIT 90, C7TL 70, CPUCTRL 55/40
# 注意: 键名必须与 lib/sched.sh 的 SCHED_NODES 一致, 改完跑 sched.sh check 自检
PELT_MULTIPLIER=2
CHILD_RUNS_FIRST=0
RT_RUNTIME_US=950000
HMBIRD_UCLAMP=0
TOUCH_UP=1
TOUCH_DOWN=1
TOUCH_DURATION=50
CFS_SCHEDSTATS=0
CFS_ENERGY_AWARE=1
ISOCTRL_HIGH=70
ISOCTRL_LOW=55
HMBIRD_PARC_HIGH=50
HMBIRD_PARC_LOW=38
PARC_HIGH_L=60
PARC_LOW_L=45
HMBIRD_MISFIT=85
HMBIRD_C7TL=60
HMBIRD_ISOLATE=0
SLIM_WALT_CTRL=1
SCX_GOV_CTRL=1
