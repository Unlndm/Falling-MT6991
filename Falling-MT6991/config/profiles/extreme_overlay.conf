# ============================================================
# 极致省电限制层参数 (v3.4.0)
#
# 这不是档位, 是叠加在任何档位之上的限制层。
# 由 lib/extreme.sh 读取, 对档位值取"更严的一侧"(min), 绝不放宽。
#
# 【标定入口】: 实机标定完只改本文件, 不动代码。
#
# 取值依据:
#   MAXFREQ      CPU 三簇上限目标(kHz), 顺序 policy0 policy4 policy7。
#                实际写入值会再从 config/device.conf 的实机频率表里
#                取"<= 目标"的最大真实频点, 保证一定可写。
#                当前值 = 该簇实机频率表里偏低的档位, 属于"能跑但明显慢"。
#   UP_RATE      sugov_ext 升频间隔(us)。实机标定(PLC110, 绑定 cpu7 满载,
#                0.2s 采样 scaling_cur_freq): 10000 -> 0.4s 到 3400000;
#                50000 -> 约 3.2s 到 3200000(3.4s 到 3600000);
#                200000 -> 先掉到 1200000, 约 6.6s 才到 3600000。
#                轻载下 200000 会把 CPU 钉在 798000 地板(docs/arch-realdevice.md 实验2)。
#                取 50000: 有负载仍能升到顶, 但不会"一有波动就满频", 符合省电层定位。
#   DOWN_RATE    sugov_ext 降频间隔(us)。越小掉得越快 = 更省电。
#   CPUCTRL_*    hmbird boost 触发/退出百分比阈值。越大越晚触发 boost =
#                boost 越少 = 越省电。机制见 sched_*.conf 注释。
#   GPU_UPBOUND  GPU 频率上限(kHz)。实际写入值同样从实机 GPU 频率表取点。
#   GPU_BOOST    GPU boost 频率(kHz)。
#   GPU_BOOST_ENABLE  GPU boost 总开关(0=关)。
#
# 故意没有的项:
#   CM_DRAM_OPP_*  cm_mgr 的 DRAM OPP 上下限方向未实机确证
#                  (现有 powersave=6 与 powersave+=7 方向自相矛盾),
#                  方向确认前不覆写, 沿用当前档位值。
# ============================================================
[CPU]
MAXFREQ=1000000 1200000 1400000
UP_RATE=50000
DOWN_RATE=10
CPUCTRL_HIGH=95
CPUCTRL_LOW=85
[GPU]
GPU_UPBOUND=546000
GPU_BOOST=338000
GPU_BOOST_ENABLE=0
