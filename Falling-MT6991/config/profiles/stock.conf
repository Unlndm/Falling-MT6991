# 出厂还原档(仅 uninstall.sh 内部使用, 不是用户档位)
# 为什么需要它: v3.5.0 起 balanced 变成「日常省电档」(CPU/GPU 上限都压低了)。
# 卸载时若继续拿 balanced 还原, 会在卸载到重启这段窗口里把 GPU 上限留在低值、
# 把 cm_mgr 性能模式留在关闭状态 —— 属于残留。
# 本档 = v3.4.0 的均衡档非 CPU 部分(与出厂接近):
#   GPU 上限 1508000 / 调速器 dummy / cm_mgr 性能模式开 / c2ps 省电模式开。
# MAXFREQ 故意留空: 频率上限由 lib/loop.sh 落盘, 卸载时守护已停, 留空即不写;
# 重启后所有节点本来也会复位。
[CPU]
GOVERNOR=sugov_ext sugov_ext sugov_ext
EXEC_LEVEL=3
[GPU]
DEVFREQ_GOVERNOR=dummy
GPU_UPBOUND=1508000
GPU_BOOST=338000
GPU_BOOST_ENABLE=0
[CM]
CM_PERF_MODE_ENABLE=1
CM_PERF_CEILING_OPP=0
CM_DRAM_OPP_CEILING=-1
[C2PS]
C2PS_UM_MODE=Y
