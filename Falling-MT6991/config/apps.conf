# ============================================================
# Falling-MT6991 应用策略
# 包名=档位            -> 应用独立调度档位
# 包名@touch=采样率码  -> 应用专属触控采样率(360=360Hz, 一加Ace5系 182 节点)
# 档位: performance|balanced|powersave|powersave+|game_medium
# 说明: 游戏不在此登记(v9.0 起游戏 CPU 交官方 HyperBoost/风驰调度, 模块不干预);
#       本表用于给非游戏应用单独指定频率档位
# ============================================================
SCREEN_OFF_PROFILE=powersave